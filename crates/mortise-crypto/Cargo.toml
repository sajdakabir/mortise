[package]
name = "mortise-crypto"
version = "0.1.0"
description = "Cryptographic core for Mortise. No Tauri, no UI, no network."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.6.0"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.14.1", features = ["hkdfsha2"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
proptest = "1.11.0"
