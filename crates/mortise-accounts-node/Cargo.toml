[package]
name = "mortise-accounts-node"
version = "0.1.0"
description = "Node-API transport for Mortise's existing account service"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[features]
vendored-tls = ["mortise-accounts/vendored-tls"]

[dependencies]
mortise-accounts = { path = "../mortise-accounts", features = ["postgres"] }
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1", features = ["sync"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
