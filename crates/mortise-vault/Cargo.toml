[package]
name = "mortise-vault"
version = "0.1.0"
description = "Local encrypted store for Mortise. SQLite, no network."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
csv = "1.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
mortise-crypto = { version = "0.1.0", path = "../mortise-crypto" }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
# Lets the migration test build a vault key in the pre-Auth-mode format, so the
# upgrade is exercised against a real legacy blob rather than a stand-in.
mortise-crypto = { version = "0.1.0", path = "../mortise-crypto", features = ["legacy-base-wrap"] }
