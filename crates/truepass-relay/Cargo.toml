[package]
name = "truepass-relay"
version = "0.1.0"
description = "Zero-knowledge sync relay for TruePassword. Stores signed ciphertext it cannot read."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The protocol module is always available so clients can share the request
# canonicalization. The server half is opt-in, so the desktop app does not
# drag axum and tokio in just to sign a request.
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:tower", "dep:rusqlite", "dep:tracing", "dep:tracing-subscriber"]

[[bin]]
name = "truepass-relay"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
truepass-crypto = { path = "../truepass-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"

axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
tower = { version = "0.5", optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
