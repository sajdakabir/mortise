[package]
name = "truepass-vault"
version = "0.1.0"
description = "Local encrypted store for TruePassword. SQLite, no network."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
truepass-crypto = { version = "0.1.0", path = "../truepass-crypto" }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
