[package]
name = "mortise-cli"
version = "0.1.0"
description = "The `mortise` command: run a program with secrets from the Mortise vault in its environment."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mortise"
path = "src/main.rs"

[lib]
name = "mortise_cli"
path = "src/lib.rs"

[dependencies]
mortise-proxy = { path = "../mortise-proxy" }
mortise-vault = { path = "../mortise-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zeroize = "1"

[dev-dependencies]
tempfile = "3.27.0"
