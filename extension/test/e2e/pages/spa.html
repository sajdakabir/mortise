<!doctype html>
<!--
  A single-page app: the document loads empty and the form is rendered later,
  with no <form> element and no submit — the button is a div with a click
  handler, as plenty of real sign-in pages are. Like a controlled React input,
  the app only knows what it was told through input events, so a fill that
  sets .value without firing them signs in with nothing.
-->
<html lang="en">
  <head><meta charset="utf-8" /><title>App</title></head>
  <body>
    <div id="root"><p id="loading">Loading…</p></div>
    <script>
      const state = { username: "", password: "" };
      setTimeout(() => {
        const root = document.getElementById("root");
        root.innerHTML = `
          <div class="card">
            <input id="username" placeholder="Username" autocomplete="username" />
            <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
            <div id="submit" role="button" tabindex="0">Sign in</div>
          </div>`;
        for (const name of ["username", "password"]) {
          document.getElementById(name).addEventListener("input", (e) => (state[name] = e.target.value));
        }
        document.getElementById("submit").addEventListener("click", () => {
          root.innerHTML = '<h1 id="done"></h1>';
          document.getElementById("done").textContent =
            state.password ? `Signed in as ${state.username}` : "No password";
        });
      }, 1500);
    </script>
  </body>
</html>
