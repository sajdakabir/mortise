<!doctype html>
<!--
  The form lives inside a web component's (open) shadow root, so
  document.querySelectorAll cannot see it.
-->
<html lang="en">
  <head><meta charset="utf-8" /><title>Web component sign in</title></head>
  <body>
    <h1>Sign in</h1>
    <login-form></login-form>
    <script>
      customElements.define(
        "login-form",
        class extends HTMLElement {
          connectedCallback() {
            this.attachShadow({ mode: "open" }).innerHTML = `
              <form action="/signed-in" method="post">
                <input id="username" name="username" type="email" autocomplete="username" />
                <input id="password" name="password" type="password" autocomplete="current-password" />
                <button id="submit" type="submit">Sign in</button>
              </form>`;
          }
        },
      );
    </script>
  </body>
</html>
