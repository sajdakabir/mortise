<!doctype html>
<!--
  Change password: current, new, confirm. The username is present but hidden,
  which is what password managers are asked to look for on these pages.
-->
<html lang="en">
  <head><meta charset="utf-8" /><title>Change password</title></head>
  <body>
    <h1>Change password</h1>
    <form action="/signed-in" method="post">
      <input type="text" name="username" autocomplete="username" value="octocat" hidden />
      <label>Current password <input id="current" name="current" type="password" autocomplete="current-password" /></label>
      <label>New password <input id="new" name="new" type="password" autocomplete="new-password" /></label>
      <label>Confirm new password <input id="confirm" name="confirm" type="password" autocomplete="new-password" /></label>
      <button id="submit" type="submit">Change password</button>
    </form>
  </body>
</html>
