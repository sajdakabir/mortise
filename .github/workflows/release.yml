name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installer as a GitHub preview release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Version and tag
        id: version
        run: |
          python3 - <<'PY'
          import json, os, re
          version = json.load(open('crates/mortise-app/tauri.conf.json'))['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?', version), 'Invalid release version'
          tag = 'v' + version
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == tag, 'Tag and app version differ'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\ntag={tag}\n')
          PY

      - name: Rust toolchain and macOS targets
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-universal-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-universal-

      # generate_context! embeds ui/dist, so build it before compiling tests.
      - name: Frontend checks and build
        run: |
          npm --prefix ui ci
          npm --prefix ui run check
          npm --prefix ui run build

      - name: Rust checks
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build the universal browser helper
        run: |
          cargo build --release --locked -p mortise-proxy --target aarch64-apple-darwin
          cargo build --release --locked -p mortise-proxy --target x86_64-apple-darwin
          mkdir -p target/release-sidecars
          # tauri-build resolves externalBin for each Rust target before the
          # bundler selects the universal helper for the final app.
          cp target/aarch64-apple-darwin/release/mortise-proxy \
            target/release-sidecars/mortise-proxy-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/mortise-proxy \
            target/release-sidecars/mortise-proxy-x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/mortise-proxy \
            target/x86_64-apple-darwin/release/mortise-proxy \
            -output target/release-sidecars/mortise-proxy-universal-apple-darwin
          chmod 755 target/release-sidecars/mortise-proxy-universal-apple-darwin

      - name: Build universal app and DMG
        env:
          MORTISE_ACCOUNTS_URL: ${{ vars.MORTISE_ACCOUNTS_URL }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # GitHub expands absent secrets to empty strings. Tauri treats a
          # present APPLE_CERTIFICATE as a certificate to import, even if empty.
          for signing_var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!signing_var:-}" ]; then
              unset "$signing_var"
            fi
          done
          npx --yes @tauri-apps/cli@${TAURI_CLI_VERSION} build --ci \
            --target universal-apple-darwin --config .github/tauri.release.json

      - name: Package the browser extension
        run: bash extension/tools/package.sh

      - name: Verify installer and prepare checksums
        id: stage
        run: bash scripts/stage-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mortise-${{ steps.version.outputs.version }}-macos
          path: ${{ steps.stage.outputs.directory }}/
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub preview release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIR: ${{ steps.stage.outputs.directory }}
        run: |
          notes=$(mktemp)
          cat > "$notes" <<'EOF'
          Mortise's first installable preview for **Apple silicon and Intel Macs** running macOS 11 or later.

          ### Install
          1. Download the universal `.dmg` below.
          2. Open it and drag Mortise to Applications.
          3. Open Mortise from Applications. Follow `INSTALL.md` if Gatekeeper blocks this preview.

          If macOS blocks the app after you verify the download, open Terminal and run:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Mortise.app"
          ```

          Then open Mortise from Applications. This removes the download quarantine flag from Mortise only; it does not sign or notarize the app.

          This preview is **ad-hoc signed, not Apple Developer ID signed or notarized**. macOS will warn on first launch; Touch ID is unavailable. Use test credentials while the app is in preview. `BUILD.txt` identifies the source and build.

          Passwords, browser autofill/capture, imports, local projects and `.env` management are included. Team sharing remains experimental and needs a relay; managed accounts are not included in this preview.

          The optional browser extension is attached separately as `mortise-extension-0.1.0.zip`. Installation and pairing steps are in `INSTALL.md`.

          ### Verify your download
          Download the files into one folder, then run `shasum -a 256 -c SHA256SUMS`. Checksums detect damaged files; they do not replace Developer ID signing. No automatic updater is included yet.
          EOF
          # Upload while draft so visitors never see a partially uploaded release.
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "Mortise $RELEASE_VERSION" --draft --prerelease \
            --notes-file "$notes" "$RELEASE_DIR"/*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease

      # Preserve expensive compilation when packaging fails. The regular
      # cache action saves only successful jobs; the restore prefix above
      # also finds this fallback on a subsequent attempt.
      - name: Preserve compilation after a failed release
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-universal-${{ hashFiles('Cargo.lock') }}-partial-${{ github.run_id }}
